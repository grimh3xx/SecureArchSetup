name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck -x secure-arch-setup lib/*.sh tests/run.sh

  test:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - run: pacman -Syu --noconfirm --needed diffutils
      - name: Tests (scratch root)
        run: bash tests/run.sh
      - name: Dry run of every profile
        run: |
          for p in workstation pentest full; do
            ./secure-arch-setup --dry-run --yes profile "$p" > /dev/null
          done
      - name: Install layout
        run: |
          make install DESTDIR=/tmp/pkg
          SAS_LIB=/tmp/pkg/usr/lib/secure-arch-setup /tmp/pkg/usr/local/bin/secure-arch-setup --version
